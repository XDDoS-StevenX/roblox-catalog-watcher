name: Catalog Watcher Tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      debug_check_ids:
        description: "Opcional: IDs separados por coma para diagnosticar (no notifica ni guarda nada). Ej: 123456,789012"
        required: false
        default: ""

concurrency:
  group: catalog-watcher-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # 4 min era poco cuando se detectan muchos items de golpe (cada uno tarda ~1-3 s por las
    # pausas de MessagingService/miniaturas) y un corte antes del guardado repetia los avisos.
    # El bot ahora guarda estado a ratos y al recibir SIGTERM, pero conviene dar margen.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # Se usa "npm install" en vez de "npm ci" porque el repo no tiene
        # package-lock.json (npm ci lo exige y falla sin el). Con una sola
        # dependencia (dotenv), npm install es igual de rapido y no hace
        # falta generar/commitear un lockfile solo para esto.
        run: npm install --omit=dev

      - name: Run single tick
        run: node index.js
        env:
          RUN_ONCE: "true"
          DEBUG_CHECK_IDS: ${{ github.event.inputs.debug_check_ids }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.UNIVERSE_ID }}
          MESSAGING_TOPIC: ${{ secrets.MESSAGING_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          CATALOG_QUERY: ${{ secrets.CATALOG_QUERY }}
          CATALOG_QUERY_V2_BROAD: ${{ secrets.CATALOG_QUERY_V2_BROAD }}
          CATALOG_QUERY_BUNDLES: ${{ secrets.CATALOG_QUERY_BUNDLES }}
          MAX_PAGES: ${{ secrets.MAX_PAGES }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CATALOG_QUERY_BUNDLES_V2: ${{ secrets.CATALOG_QUERY_BUNDLES_V2 }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ROLIMONS_CHANNEL_ID: ${{ secrets.ROLIMONS_CHANNEL_ID }}
          ROLIMONS_LIMITED_CHANNEL_ID: ${{ secrets.ROLIMONS_LIMITED_CHANNEL_ID }}
